
name: Calidad E1 - Trusted Data Lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: Pruebas, linter y puerta de datos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Revisar codigo con Ruff
        run: python -m ruff check src tests --output-format concise

      - name: Ejecutar pruebas automatizadas
        run: python -m pytest tests/ -q

      - name: Verificar puerta de calidad Pandera y Cuarentena
        run: |
          python -m pytest \
            tests/test_calidad.py \
            tests/test_cuarentena.py \
            tests/test_pipeline.py \
            -q
