
name: Captura diaria - Trusted Data Lab

# Ejecutar automaticamente y permitir pruebas manuales
on:
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

# Permiso para guardar datos en el repositorio
permissions:
  contents: write

# Evitar capturas simultaneas
concurrency:
  group: captura-diaria
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest

    steps:
      # Descargar los archivos del repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # Preparar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Instalar las librerias
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      # Comprobar que los tokens estan configurados
      - name: Verificar configuracion
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          TDL_CONTACTO: ${{ vars.TDL_CONTACTO }}
        run: |
          test -n "$INEGI_TOKEN" || exit 1
          test -n "$BANXICO_TOKEN" || exit 1

      # Ejecutar INEGI y Banxico
      - name: Ejecutar captura
        id: captura
        continue-on-error: true
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          TDL_CONTACTO: ${{ vars.TDL_CONTACTO }}
        run: python -m extractores.main

      # Guardar datos y bitacora, incluso si una fuente falla
      - name: Guardar resultados
        if: always() && steps.captura.outcome != 'skipped'
        run: |
          git config user.name "tdl-bot"
          git config user.email "tdl-bot@users.noreply.github.com"

          git add -A data/bronce logs/capturas.csv

          if ! git diff --cached --quiet; then
            git commit -m "Captura automatica $(date -u +%F)"
            git push
          else
            echo "Sin archivos nuevos para guardar"
          fi

      # Marcar la ejecucion como fallida si hubo errores
      - name: Verificar resultado final
        if: always() && steps.captura.outcome != 'skipped'
        env:
          RESULTADO: ${{ steps.captura.outcome }}
        run: |
          if [ "$RESULTADO" != "success" ]; then
            echo "La captura presento errores"
            exit 1
          fi
